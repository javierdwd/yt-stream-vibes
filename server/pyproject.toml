[project]
name = "yt-stream-vibes-server"
version = "0.1.0"
description = "FastAPI server for yt-stream-vibes (YouTube live chat + JEV)"
readme = false
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "pytchat>=0.5.5",
  "python-dotenv>=1.0.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "typesafe-sdk>=0.7.1",
  "twitchio>=3.3.2",
  "websockets>=17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false
